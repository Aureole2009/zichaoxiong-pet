<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌宠插件 · 脏存储测试</title>
<style>
  body { font: 13px/1.6 "Microsoft YaHei UI", system-ui, sans-serif; margin: 0; padding: 18px; background: #101828; color: #e6ebf5; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #9aa7bd; }
  pre { padding: 12px; background: #0b1220; border: 1px solid #2b3550; border-radius: 10px; }
  .ok { color: #63e6a8; } .bad { color: #ff8b8b; }
</style>
</head>
<body>
<h1>脏存储测试</h1>
<p>localStorage 是不可信输入：里面可能是字符串、null、NaN。桌宠必须忽略坏坐标、回落到默认角落，
而不是把 <code>NaNpx</code> 交给 CSSOM（那会被静默丢弃，熊就被钉在左上角）。</p>
<pre id="result">running…</pre>

<script>
  // 关键：在加载替身与插件之前就把存储弄脏
  localStorage.setItem(
    "dsh-pet:zichaoxiong",
    JSON.stringify({ size: "huge", left: "x", top: null, anchored: false, hatched: true, lastLine: 42 }),
  );
</script>
<script src="dsh-shim.js"></script>
<script>
function loadBundle() {
  const candidates = ["../lib/client.js", "../plugin/lib/client.js"];
  return candidates.reduce(
    (chain, path) =>
      chain.then((found) =>
        found ??
        new Promise((resolve) => {
          const tag = document.createElement("script");
          tag.src = path;
          tag.onload = () => resolve(path);
          tag.onerror = () => resolve(null);
          document.head.append(tag);
        }),
      ),
    Promise.resolve(null),
  );
}

(async () => {
  const lines = [];
  const results = [];
  const check = (name, pass, detail) => {
    results.push(pass);
    lines.push(`${pass ? "PASS" : "FAIL"}  ${name}${detail ? "  — " + detail : ""}`);
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  try {
    const loaded = await loadBundle();
    check("加载到插件 bundle", !!loaded, loaded ?? "没找到");

    const plugin = window.__zxLoadPlugin("dsh-client-ui-pet-zichaoxiong");
    const ctx = window.__zxHarness.state.ctx;
    ctx.effect = ctx.effect.bind(ctx);
    plugin.apply(ctx);
    const rendered = window.__zxHarness.renderOverlays();
    const layer = document.querySelector(".zx-pet-layer");
    layer.parentElement.append(layer); // 从假槽位里拿出来量得更直观
    await sleep(300);

    const pet = rendered[0]?.node.querySelector(".zx-pet");
    check("脏数据下依然挂载", !!pet, pet?.className ?? "no pet");

    const left = pet.style.left;
    const top = pet.style.top;
    check("left/top 是有效像素值", /^-?\d+px$/.test(left) && /^-?\d+px$/.test(top), `${left} / ${top}`);
    check("没有 NaN 泄漏到样式里", !/NaN/.test(pet.getAttribute("style") ?? ""), pet.getAttribute("style") ?? "");

    const petRect = pet.getBoundingClientRect();
    const layerRect = layer.getBoundingClientRect();
    check("落在容器内（不是被钉在左上角）",
      petRect.left >= layerRect.left - 1 && petRect.right <= layerRect.right + 1
        && petRect.top >= layerRect.top - 1 && petRect.bottom <= layerRect.bottom + 1,
      `pet=[${Math.round(petRect.left)},${Math.round(petRect.top)}] layer=${Math.round(layerRect.width)}x${Math.round(layerRect.height)}`);
    check("确实落到了默认角落（右下）",
      petRect.right > layerRect.left + layerRect.width / 2 && petRect.bottom > layerRect.top + layerRect.height / 2,
      `right=${Math.round(petRect.right)} bottom=${Math.round(petRect.bottom)}`);

    const size = pet.style.getPropertyValue("--zx-size").trim();
    check("非法尺寸回落到合法档位", /^\d+px$/.test(size) && Number.parseInt(size, 10) >= 96, size);

    const stored = JSON.parse(localStorage.getItem("dsh-pet:zichaoxiong") ?? "{}");
    check("不会把 null 坐标写回存储",
      stored.left !== null && stored.top !== null && !("left" in stored) && !("top" in stored),
      JSON.stringify(stored));
    check("存的是「跟着角落」而不是坏坐标", stored.anchored === true, String(stored.anchored));

    // 拖动一下应该恢复成固定坐标并正常保存
    const cx = petRect.left + petRect.width / 2;
    const cy = petRect.top + petRect.height / 2;
    pet.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, clientX: cx, clientY: cy }));
    window.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: cx - 120, clientY: cy - 80 }));
    window.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: cx - 120, clientY: cy - 80 }));
    await sleep(150);
    const after = JSON.parse(localStorage.getItem("dsh-pet:zichaoxiong") ?? "{}");
    check("拖动后写回可用的固定坐标",
      Number.isFinite(after.left) && Number.isFinite(after.top) && after.anchored === false,
      JSON.stringify(after));

    window.__zxHarness.disposeAll();
    await sleep(150);
    check("卸载后不留 DOM", !document.querySelector(".zx-pet"));

    const failed = results.filter((r) => !r).length;
    document.title = failed === 0 ? "ALL PASS" : `${failed} FAILED`;
    lines.push("", failed === 0 ? `ALL PASS (${results.length}/${results.length})` : `${failed} FAILED of ${results.length}`);
    document.getElementById("result").innerHTML = lines
      .map((l) => (l.startsWith("PASS") ? `<span class="ok">${l}</span>` : l.startsWith("FAIL") ? `<span class="bad">${l}</span>` : l))
      .join("\n");
  } catch (error) {
    document.title = "HARNESS ERROR";
    lines.push(`HARNESS ERROR: ${error && error.stack ? error.stack : error}`);
    document.getElementById("result").textContent = lines.join("\n");
  }
})();
</script>
</body>
</html>
